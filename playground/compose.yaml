# The VCLI playground is disposable and never intended for production.
# Native TLS is generated by the real Vault dev server at startup.
services:
  vault:
    image: hashicorp/vault:${VCLI_PG_VAULT_TAG:-2.1.1}
    command: ["server", "-dev", "-dev-tls", "-dev-tls-cert-dir=/tmp", "-dev-listen-address=0.0.0.0:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VCLI_PG_ROOT_TOKEN:?missing temporary Vault token}
    labels:
      io.vcli.playground.owner: ${VCLI_PG_OWNER:?missing playground owner}
    ports:
      - "127.0.0.1::8200"
    restart: "no"
