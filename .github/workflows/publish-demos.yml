name: Publish vcli terminal demos

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-demos.yml'
      - 'docs/asciinema-player.html'
      - 'scripts/validate-published-casts.py'
      - 'assets/branding/favicon.svg'
  workflow_run:
    workflows: [VCLI trunk validation, SaaS playground scale acceptance]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: vcli-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Assemble site from verified recordings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/casts
          cp docs/asciinema-player.html site/index.html
          cp assets/branding/favicon.svg site/favicon.svg
          python3 - <<'PY'
          from pathlib import Path
          html = Path("site/index.html").read_text()
          assert "AsciinemaPlayer.create" in html and "DecompressionStream" in html
          PY
          for task in 'ci.yml|vcli-playground-asciinema|vcli-playground.cast' \
            'playground-saas.yml|vcli-playground-saas-asciinema|vcli-playground-saas.cast'; do
            IFS='|' read -r workflow artifact cast <<< "$task"
            chosen=''
            while IFS= read -r rid; do
              [[ -n "$rid" ]] || continue
              if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$rid/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.expired == false) | .name' |
                grep -Fxq -- "$artifact"; then
                chosen=$rid
                break
              fi
            done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?status=success&per_page=100" \
              --jq '.workflow_runs[] | select(.head_repository.full_name == "'$GITHUB_REPOSITORY'" and (.head_branch == "master" or .head_branch == "ci/baseline-vault-revival")) | .id')
            if [[ -z "$chosen" ]]; then
              echo "::error::No verified $artifact recording is available; refusing an incomplete Pages deployment"
              exit 1
            fi
            gh run download "$chosen" -R "$GITHUB_REPOSITORY" -n "$artifact" -D site/casts
            test -s "site/casts/$cast"
            python3 scripts/validate-published-casts.py "$cast" "site/casts/$cast"
            gzip -9 -k "site/casts/$cast"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Wait for GitHub Actions to index Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          for attempt in {1..12}; do
            visible=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[].name] | index("github-pages") != null')
            if [[ $visible == true ]]; then
              # The Pages backend can lag behind Actions artifact listing.
              sleep 12
              exit 0
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become visible"
          exit 1
      - uses: actions/deploy-pages@v4
        id: deploy

  cleanup_obsolete_branches:
    name: Retire verified obsolete branches
    needs: publish
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Remove last merged temporary branch safely
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          ref=fix/pages-artifact-visibility
          expected=25bd7654d0a9e6999e105f235efdb425f350b70a
          # Verify it is the exact merged fix, not an active branch with new work.
          if ! observed=$(gh api "repos/$REPO/git/ref/heads/$ref" --jq '.object.sha' 2>/dev/null); then
            echo "Already clean: $ref no longer exists"
            exit 0
          fi
          if [[ "$observed" != "$expected" ]]; then
            echo "::error::Temporary branch changed: leaving it untouched"
            exit 1
          fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$ref"
          echo "Removed merged temporary branch $ref"
