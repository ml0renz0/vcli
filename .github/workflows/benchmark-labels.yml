name: PR recursive benchmark via labels

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Independent from normal CI: one selected backend, never the seven-Vault matrix.
concurrency:
  group: vcli-benchmark-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark ${{ github.event.label.name }}
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.label.name == 'bench:inmem' ||
          github.event.label.name == 'bench:raft-1' ||
          github.event.label.name == 'bench:raft-3'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout candidate and baseline history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate benchmark scripts and contracts
        run: |
          bash -n ./vcli ./scripts/bench-compare.sh ./tests/integration/run.sh ./tests/integration/run-raft.sh
          python3 -m unittest -v tests.cli.test_recursive_benchmark
      - name: Install benchmark requirements
        run: |
          missing=()
          for cmd in jq curl openssl; do
            command -v "$cmd" >/dev/null || missing+=("$cmd")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "${missing[@]}"
          fi
      - name: Compare against pinned pre-refactor revision
        env:
          VCLI_BENCH_STORAGE: ${{ github.event.label.name == 'bench:raft-3' && 'raft-3' || github.event.label.name == 'bench:raft-1' && 'raft-1' || 'inmem' }}
        run: |
          bash scripts/bench-compare.sh \
            4f96cf2091be1d6c70a5e3df3bf214d6dfb4c67e 10,100 4
