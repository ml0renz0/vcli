name: SaaS playground scale acceptance

on:
  pull_request:
    paths:
      - 'scripts/playground-seed-saas.py'
      - 'scripts/playground.sh'
      - 'scripts/playground-seed.sh'
      - 'scripts/playground-demo.sh'
      - 'scripts/record-playground-demo.sh'
      - 'vcli'
      - 'tests/playground/test_enterprise.py'
      - 'tests/playground/test_saas.py'
      - 'tests/cli/test_saas_manifest.py'
      - '.github/workflows/playground-saas.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcli-saas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  saas:
    name: 8640-secret SaaS acceptance (real Vault TLS)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install playground requirements
        run: |
          sudo apt-get update -qq -o Acquire::Retries=2
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq jq curl openssl krb5-user asciinema
          docker compose version
          python3 tests/cli/test_saas_manifest.py
          python3 - <<'PY'
          from pathlib import Path
          compile(Path('tests/playground/test_saas.py').read_text(), 'test_saas.py', 'exec')
          source = Path("scripts/playground-demo.sh").read_text()
          compile(source.split("<<'PY'\n", 1)[1].rsplit("\nPY", 1)[0], "playground-demo.sh", "exec")
          PY
      - name: Seed the additive SaaS profile
        env:
          VCLI_PLAYGROUND_PROFILE: saas
        run: scripts/playground.sh up
      - name: Unified interactive SaaS acceptance and recording
        env:
          VCLI_SAAS_METRICS: ${{ github.workspace }}/vcli-saas-metrics.json
        run: scripts/record-playground-demo.sh vcli-playground-saas.cast
      - name: Validate the continuous cast and private credential exclusion
        run: |
          python3 - <<'PY'
          import json, pathlib, re
          rows = pathlib.Path("vcli-playground-saas.cast").read_text().splitlines()
          header = json.loads(rows[0])
          assert header["version"] in (2, 3)
          assert "idle_time_limit" not in header
          events = [json.loads(row) for row in rows[1:]]
          output = "".join(e[2] for e in events if e[1] == "o")
          output = re.sub(r"\x1b(?:\[[0-?]*[ -/]*[@-~]|\([A-Za-z])", "", output)
          for value in ("tenant-032", "[OK]", "[WARNING]", "[CRITICAL]", "[EXPIRED]",
                        "invalid keytab or principal", "certificate/private key mismatch",
                        "Vault backup restored:", "FAKE-SHARED-ROTATED", "[403]", "[404]",
                        "scripts/playground.sh shell readonly", "scripts/playground.sh shell admin",
                        "scripts/playground.sh shell tenant-001",
                        "REST acceptance PASS: 8640 restored values", "exit 0"):
              assert value in output, f"Missing SaaS demo marker: {value}"
          for name in ("root-token", "readonly-token", "role-id", "secret-id"):
              secret = pathlib.Path(".playground", name).read_text().strip()
              assert not secret or secret not in output, "Credential in cast"
          assert len(events) > 100
          metrics = json.loads(pathlib.Path("vcli-saas-metrics.json").read_text())
          assert metrics["status"] == "passed"
          assert len(metrics["commands_covered"]) == 43
          full = [r for r in metrics["operations"] if r["case"].startswith("full recovery ")]
          assert sum(r["leaves"] for r in full) == 8640
          assert len(full) == 3
          print("Validated continuous SaaS recording and measured full recovery")
          PY
      - name: Upload the verified SaaS asciicast
        uses: actions/upload-artifact@v4
        with:
          name: vcli-playground-saas-asciinema
          path: vcli-playground-saas.cast
          if-no-files-found: error
          retention-days: 7
      - name: Upload measured acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vcli-saas-metrics
          path: vcli-saas-metrics.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable Vault
        if: always()
        run: scripts/playground.sh down
